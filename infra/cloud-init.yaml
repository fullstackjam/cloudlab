#cloud-config
# Use on a new node. Mount /data before running cloudlab-install.
package_update: true
packages: [curl, ca-certificates, jq, restic, sqlite3]
write_files:
  - path: /etc/rancher/k3s/config.yaml
    permissions: '0600'
    content: |
      disable:
        - traefik
        - servicelb
      default-local-storage-path: /data/k3s/storage
      data-dir: /data/k3s/server
      write-kubeconfig-mode: "0600"
  - path: /usr/local/sbin/cloudlab-install
    permissions: '0700'
    content: |
      #!/bin/bash
      set -euo pipefail
      mountpoint -q /data || { echo 'Mount the data disk at /data first'; exit 1; }
      test "$(findmnt -n -o FSTYPE /data)" = ext4
      mkdir -p /data/k3s/storage
      curl -fL https://get.k3s.io -o /root/install-k3s.sh
      INSTALL_K3S_VERSION=v1.34.1+k3s1 sh /root/install-k3s.sh
runcmd:
  - [bash, -c, 'echo "Mount /data, then run /usr/local/sbin/cloudlab-install"']
