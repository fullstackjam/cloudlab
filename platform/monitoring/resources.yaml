apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: apps
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  upgrade:
    crds: CreateReplace
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: monitoring.coreos.com
          version: v1
          kind: Alertmanager
        # Let the operator copy the native configuration without parsing it.
        patch: |
          - op: remove
            path: /spec/alertmanagerConfigSelector
  values:
    additionalPrometheusRulesMap:
      cloudlab-storage:
        groups:
        - name: cloudlab.storage
          rules:
          - alert: CloudLabDataDiskUsageHigh
            expr: |
              100 * (1 -
                node_filesystem_avail_bytes{mountpoint="/data",fstype="ext4"}
                / node_filesystem_size_bytes{mountpoint="/data",fstype="ext4"}
              ) > 80
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: CloudLab /data usage exceeded 80% for ten minutes
    defaultRules:
      rules:
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
    grafana:
      plugins:
      - yesoreyeram-infinity-datasource@4.1.6
      dashboardProviders:
        healthyapps.yaml:
          apiVersion: 1
          providers:
          - name: healthyapps
            folder: Health Auto Export
            type: file
            options:
              path: /var/lib/grafana/dashboards/healthyapps
      defaultCurlOptions: "-fsSL --retry 3"
      dashboards:
        healthyapps:
          health-metrics:
            url: https://raw.githubusercontent.com/HealthyApps/health-auto-export-server/d0f3a78e17aeb2e01fb7da89a4bf25f67057fc0e/dashboard-examples/health-metrics.json
          workout-details:
            url: https://raw.githubusercontent.com/HealthyApps/health-auto-export-server/d0f3a78e17aeb2e01fb7da89a4bf25f67057fc0e/dashboard-examples/workout-details.json
          workouts-table:
            url: https://raw.githubusercontent.com/HealthyApps/health-auto-export-server/d0f3a78e17aeb2e01fb7da89a4bf25f67057fc0e/dashboard-examples/workouts-table.json
            datasource:
            - name: DS_INFINITY-DATASOURCE-SERVER-INTERNAL
              value: bee4k1otx5urkf
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: local-path
        size: 5Gi
      sidecar:
        datasources:
          resource: both
          url: http://thanos-query.apps.svc.cluster.local:10902
    prometheus:
      thanosService:
        enabled: true
      prometheusSpec:
        retention: 3d
        retentionSize: 8GB
        disableCompaction: true
        thanos:
          image: quay.io/thanos/thanos:v0.42.5
          version: v0.42.5
          objectStorageConfig:
            existingSecret:
              name: thanos-objstore
              key: objstore.yml
          additionalArgs:
          - name: shipper.upload-compacted
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 12Gi
    alertmanager:
      enabled: true
      alertmanagerSpec:
        image:
          registry: quay.io
          repository: prometheus/alertmanager
          tag: v0.35.0
        useExistingSecret: true
        configSecret: cloudlab-alertmanager
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
