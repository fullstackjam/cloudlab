apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: apps
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: infra
    sectionName: web
  hostnames:
  - grafana.${CLOUDLAB_DOMAIN}
  rules:
  - backendRefs:
    - name: monitoring-grafana
      port: 80
