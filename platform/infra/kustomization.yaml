apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- resources.yaml
- thanos.yaml
configMapGenerator:
- name: grafana-dashboard-apple-health
  namespace: apps
  files:
  - dashboards/apple-health.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
