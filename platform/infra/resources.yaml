apiVersion: v1
kind: Namespace
metadata:
  name: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: infra
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: 42.4.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      replicas: 1
    service:
      spec:
        type: ClusterIP
    providers:
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: true
      listeners:
        web:
          port: 8000
          namespacePolicy:
            from: All
    log:
      level: INFO
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 384Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: apps
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  upgrade:
    crds: CreateReplace
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: monitoring.coreos.com
          version: v1
          kind: Alertmanager
        # Let the operator copy the native configuration without parsing it.
        patch: |
          - op: remove
            path: /spec/alertmanagerConfigSelector
  values:
    additionalPrometheusRulesMap:
      cloudlab-storage:
        groups:
        - name: cloudlab.storage
          rules:
          - alert: CloudLabDataDiskUsageHigh
            expr: |
              100 * (1 -
                node_filesystem_avail_bytes{mountpoint="/data",fstype="ext4"}
                / node_filesystem_size_bytes{mountpoint="/data",fstype="ext4"}
              ) > 80
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: CloudLab /data usage exceeded 80% for ten minutes
    defaultRules:
      rules:
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
    grafana:
      plugins:
      - yesoreyeram-infinity-datasource@4.1.6
      dashboardProviders:
        healthyapps.yaml:
          apiVersion: 1
          providers:
          - name: healthyapps
            folder: Health Auto Export
            type: file
            options:
              path: /var/lib/grafana/dashboards/healthyapps
      dashboards:
        healthyapps:
          health-metrics:
            url: https://raw.githubusercontent.com/HealthyApps/health-auto-export-server/d0f3a78e17aeb2e01fb7da89a4bf25f67057fc0e/dashboard-examples/health-metrics.json
          workout-details:
            url: https://raw.githubusercontent.com/HealthyApps/health-auto-export-server/d0f3a78e17aeb2e01fb7da89a4bf25f67057fc0e/dashboard-examples/workout-details.json
          workouts-table:
            url: https://raw.githubusercontent.com/HealthyApps/health-auto-export-server/d0f3a78e17aeb2e01fb7da89a4bf25f67057fc0e/dashboard-examples/workouts-table.json
            datasource:
            - name: DS_INFINITY-DATASOURCE-SERVER-INTERNAL
              value: bee4k1otx5urkf
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: local-path
        size: 5Gi
      sidecar:
        datasources:
          resource: both
          url: http://thanos-query.apps.svc.cluster.local:10902
    prometheus:
      thanosService:
        enabled: true
      prometheusSpec:
        retention: 3d
        retentionSize: 8GB
        disableCompaction: true
        thanos:
          image: quay.io/thanos/thanos:v0.42.5
          version: v0.42.5
          objectStorageConfig:
            existingSecret:
              name: thanos-objstore
              key: objstore.yml
          additionalArgs:
          - name: shipper.upload-compacted
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 12Gi
    alertmanager:
      enabled: true
      alertmanagerSpec:
        image:
          registry: quay.io
          repository: prometheus/alertmanager
          tag: v0.35.0
        useExistingSecret: true
        configSecret: cloudlab-alertmanager
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.11.0
        ports:
        - containerPort: 2000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 2000
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared
              key: token
        args:
        - tunnel
        - --no-autoupdate
        - --metrics
        - 0.0.0.0:2000
        - run
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared
  namespace: infra
spec:
  selector:
    app: cloudflared
  ports:
  - port: 2000
    targetPort: 2000
