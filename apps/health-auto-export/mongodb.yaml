apiVersion: v1
kind: Service
metadata:
  name: health-auto-export-mongo
  namespace: apps
spec:
  clusterIP: None
  selector:
    app: health-auto-export-mongo
  ports:
  - port: 27017
    name: mongo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: health-auto-export-mongo-init
  namespace: apps
data:
  create-user.js: |
    db.getSiblingDB('admin').createUser({
      user: 'health-auto-export',
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{ role: 'readWrite', db: 'health-auto-export' }],
    });
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: health-auto-export-mongo
  namespace: apps
spec:
  serviceName: health-auto-export-mongo
  replicas: 1
  selector:
    matchLabels:
      app: health-auto-export-mongo
  template:
    metadata:
      labels:
        app: health-auto-export-mongo
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mongo
        image: mongo:8.0@sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7
        args: ["--wiredTigerCacheSizeGB=0.25"]
        ports:
        - name: mongo
          containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: admin
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: health-auto-export
              key: mongo-root-password
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: health-auto-export
              key: mongo-app-password
        volumeMounts:
        - name: data
          mountPath: /data/db
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: mongo
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 1Gi
      volumes:
      - name: init
        configMap:
          name: health-auto-export-mongo-init
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: local-path
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Gi
