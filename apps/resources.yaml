  parentRefs:
  - name: traefik-gateway
    namespace: infra
    sectionName: web
  hostnames:
  - health.fullstackjam.com
  rules:
  - backendRefs:
    - name: influxdb
      port: 8086
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home
  namespace: apps
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: infra
    sectionName: web
  hostnames:
  - home.fullstackjam.com
  rules:
  - backendRefs:
    - name: homepage
      port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
