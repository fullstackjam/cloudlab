  - name: traefik-gateway
    namespace: infra
    sectionName: web
  hostnames:
  - status.fullstackjam.com
  rules:
  - backendRefs:
    - name: uptime-kuma
      port: 3001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: health
  namespace: apps
